name: Refresh GitHub Star Atlas

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 fetch_github_10k.py
          python3 fetch_trending.py

      - name: Build
        run: npm run build

      - name: Commit updated data if changed
        run: |
          if [[ -n "$(git status --porcelain public/data.json public/first_seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data.json public/first_seen.json
            git commit -m "chore(data): refresh GitHub star atlas"
            git pull --rebase origin main
            git push
          else
            echo "No data changes to commit."
          fi

      # Bot pushes don't trigger other workflows, so the refresh deploys
      # the freshly built site itself.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
