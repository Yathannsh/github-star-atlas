name: Refresh GitHub Star Atlas

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 fetch_github_10k.py
          python3 fetch_trending.py
          python3 backfill_history.py --details --budget 100

      - name: Build
        run: npm run build

      - name: Commit updated data if changed
        run: |
          if [[ -n "$(git status --porcelain public/data.json public/first_seen.json public/details.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data.json public/first_seen.json public/details.json
            git commit -m "chore(data): refresh GitHub star atlas"
            git pull --rebase origin main
            git push
          else
            echo "No data changes to commit."
          fi

      # Pages deployments are keyed by commit SHA, so this run cannot deploy
      # its own artifact (a deploy at this SHA may already exist from the
      # push that triggered pages.yml). Dispatch pages.yml instead — it
      # builds at the fresh data commit. workflow_dispatch created with
      # GITHUB_TOKEN is exempt from the bot no-retrigger rule.
      - name: Deploy site with fresh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
